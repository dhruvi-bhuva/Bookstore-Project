<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="400" height="580">
  <defs>
    <linearGradient id="grad-project-hail-mary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="580" rx="8" fill="url(#grad-project-hail-mary)"/>
  <rect x="0" y="0" width="28" height="580" fill="#000000" opacity="0.25"/>
  <rect x="28" y="0" width="4" height="580" fill="#ffffff" opacity="0.12"/>
  <rect x="42" y="24" width="334" height="532" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Category -->
  <g transform="translate(60, 48)">
    <rect width="160" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/>
    <text x="80" y="17" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">SCIENCE FICTION</text>
  </g>
  
  <!-- Icon -->
  <g transform="translate(160, 110)">
    <circle cx="40" cy="40" r="46" fill="#ffffff" fill-opacity="0.15"/>
    <g transform="translate(24, 24) scale(1.35)">
      <path d="M12 2l3 7h6l-5 4 2 7-6-4-6 4 2-7-5-4h6z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Title -->
  <g transform="translate(60, 260)">
    <text x="0" y="0" fill="#ffffff" font-family="'Georgia', serif" font-size="28" font-weight="bold">
      <tspan x="0" dy="0">Project Hail Mary</tspan>
    </text>
  </g>
  
  <!-- Subtitle -->
  <g transform="translate(60, 395)">
    <text x="0" y="0" fill="#ffffff" fill-opacity="0.85" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic">
      <tspan x="0" dy="0">A Lone Astronaut. An</tspan><tspan x="0" dy="20">Impossible Mission.</tspan>
    </text>
  </g>
  
  <line x1="60" y1="460" x2="340" y2="460" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Author -->
  <g transform="translate(60, 495)">
    <text x="0" y="0" fill="#ffffff" fill-opacity="0.7" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="2">AUTHOR</text>
    <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Andy Weir</text>
  </g>
  
  <!-- Seal -->
  <g transform="translate(310, 485)">
    <circle cx="20" cy="20" r="18" fill="#fbbf24"/>
    <polygon points="20,10 22,17 29,17 23,21 25,28 20,24 15,28 17,21 11,17 18,17" fill="#78350f"/>
